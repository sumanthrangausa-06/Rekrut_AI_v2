# =============================================================================
# Judge0 Server Configuration
# =============================================================================
# This file is mounted into the Judge0 server container at /api/config/server.conf
# Reference: https://github.com/judge0/judge0/blob/master/config/server.conf
# =============================================================================

# --- Server Settings ---
# Port the Judge0 API listens on (inside container)
PORT=2358

# --- Database ---
DATABASE_URL=postgresql://judge0:judge0_password_change_me@postgres-sandbox:5432/judge0

# --- Redis ---
REDIS_URL=redis://redis-sandbox:6379/0

# --- Authentication (disabled for local dev; enable in production) ---
# To enable: set to a strong random string and send as X-Auth-Token header
# AUTHN_TOKEN=

# --- Rate Limiting ---
# Max submissions per second per IP
RATE_LIMIT=100

# --- Logging ---
VERBOSE_LOG=true

# --- CORS ---
# Allow requests from Rekrut AI frontend/backend
CORS_ORIGINS=*

# --- Submission Defaults ---
# Maximum time limit (seconds) a submission can request
default_max_cpu_time=15
# Maximum memory limit (KB) a submission can request  
default_max_memory=512000
# Maximum output size (bytes) allowed
default_max_output_size=4096

# --- Security ---
# Disable network access inside sandbox containers
DISABLE_NETWORK=true

# --- Worker Settings ---
# Number of concurrent workers (adjust based on host CPU)
workers=2
