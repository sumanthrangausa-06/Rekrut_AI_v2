# =============================================================================
# Judge0 Workers Configuration
# =============================================================================
# This file is mounted into the Judge0 workers container at /api/config/workers.conf
# Reference: https://github.com/judge0/judge0/blob/master/config/workers.conf
# =============================================================================

# --- Database ---
DATABASE_URL=postgresql://judge0:judge0_password_change_me@postgres-sandbox:5432/judge0

# --- Redis ---
REDIS_URL=redis://redis-sandbox:6379/0

# --- Worker Settings ---
# Number of concurrent workers
workers=2

# --- Logging ---
VERBOSE_LOG=true

# --- Security ---
# Disable network access inside sandbox containers
DISABLE_NETWORK=true

# --- Resource Limits ---
# Maximum time limit (seconds) a submission can request
max_cpu_time=15
# Maximum memory limit (KB) a submission can request
max_memory=512000
# Maximum output size (bytes) allowed
max_output_size=4096
# Maximum number of processes a submission can create
max_processes_and_or_threads=60
# Enable per-process time limit
enable_per_process_and_thread_time_limit=true
# Enable per-process memory limit
enable_per_process_and_thread_memory_limit=true
# Maximum stack size (KB)
max_stack_size=128000
# Maximum number of file descriptors
max_file_size=4096
# Number of allowed syscalls (0 = all)
allowed_syscalls=
