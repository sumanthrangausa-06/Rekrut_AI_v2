<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekrut AI — System Status</title>
  <style>
    :root {
      --ok: #22c55e;
      --warn: #eab308;
      --err: #ef4444;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.5;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { margin: 0 0 0.25rem; font-size: 1.75rem; }
    .subtitle { color: var(--muted); margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 0.75rem; padding: 1.25rem;
    }
    .card h2 { margin: 0 0 0.75rem; font-size: 1.1rem; display: flex; align-items: center; gap: 0.5rem; }
    .badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600;
    }
    .badge.ok { background: rgba(34,197,94,0.15); color: var(--ok); }
    .badge.warn { background: rgba(234,179,8,0.15); color: var(--warn); }
    .badge.err { background: rgba(239,68,68,0.15); color: var(--err); }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
    .dot.err { background: var(--err); box-shadow: 0 0 6px var(--err); }
    .detail { color: var(--muted); font-size: 0.9rem; margin-top: 0.5rem; }
    .detail strong { color: var(--text); }
    .detail code {
      background: rgba(255,255,255,0.06); padding: 0.1rem 0.35rem;
      border-radius: 0.25rem; font-size: 0.82rem;
    }
    .footer {
      margin-top: 1.5rem; padding-top: 1rem;
      border-top: 1px solid var(--border); color: var(--muted);
      font-size: 0.85rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;
    }
    .refreshing { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .error-box {
      background: rgba(239,68,68,0.08); border: 1px solid var(--err);
      color: var(--err); padding: 0.75rem; border-radius: 0.5rem; font-size: 0.9rem;
    }
    .checks { margin-top: 0.5rem; }
    .check { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0.15rem 0; }
    .check span:first-child { color: var(--muted); }
    .check span:last-child { font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Rekrut AI — System Status</h1>
    <p class="subtitle">Real-time health monitoring for all environments</p>

    <div id="status-grid" class="grid">
      <div class="card"><h2>Production</h2><p class="detail">Loading…</p></div>
      <div class="card"><h2>Staging</h2><p class="detail">Loading…</p></div>
      <div class="card"><h2>This Instance</h2><p class="detail">Loading…</p></div>
    </div>

    <div class="footer">
      <span id="last-checked">Last checked: —</span>
      <span>Auto-refresh: <span id="countdown">60</span>s</span>
    </div>
  </div>

  <script>
    const ENDPOINTS = {
      production: { url: 'https://rekrutai.co/api/health', name: 'Production' },
      staging:    { url: 'https://rekrutai-staging.onrender.com/api/health', name: 'Staging' },
      local:      { url: '/api/health', name: 'This Instance' },
    };
    const TIMEOUT_MS = 8000;
    const REFRESH_S = 60;

    async function fetchHealth({ url, name }) {
      const start = performance.now();
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
        const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
        clearTimeout(t);
        const body = await res.json().catch(() => ({}));
        const ms = Math.round(performance.now() - start);
        const ok = res.ok && (body.status === 'ok' || body.db?.connected);
        const degraded = res.ok && body.status === 'degraded';
        return {
          name, url, ok, degraded, ms,
          status: ok ? 'ok' : degraded ? 'degraded' : 'error',
          body,
          error: null,
        };
      } catch (err) {
        return { name, url, ok: false, degraded: false, ms: Math.round(performance.now() - start), status: 'error', body: {}, error: err.message };
      }
    }

    function renderCard(result) {
      const badgeClass = result.ok ? 'ok' : result.degraded ? 'warn' : 'err';
      const badgeText = result.ok ? 'Operational' : result.degraded ? 'Degraded' : 'Down';
      const dots = `<span class="dot ${badgeClass}"></span>`;

      let checks = '';
      if (result.body.db) {
        checks += `<div class="check"><span>Database</span><span>${result.body.db.connected ? 'Connected' : 'Disconnected'}</span></div>`;
      }
      if (result.body.tables) {
        const missing = (result.body.issues?.missingTables || []).length;
        checks += `<div class="check"><span>Tables</span><span>${missing ? missing + ' missing' : 'All OK'}</span></div>`;
      }
      if (result.body.pool) {
        checks += `<div class="check"><span>Pool</span><span>${result.body.pool.totalCount} total / ${result.body.pool.idleCount} idle</span></div>`;
      }
      if (result.body.env) {
        const missing = (result.body.issues?.missingEnv || []).length;
        checks += `<div class="check"><span>Env</span><span>${missing ? missing + ' missing' : 'All OK'}</span></div>`;
      }
      if (result.body.version) {
        checks += `<div class="check"><span>Version</span><span><code>${result.body.version}</code></span></div>`;
      }
      if (result.body.commit && result.body.commit !== 'unknown') {
        checks += `<div class="check"><span>Commit</span><span><code>${result.body.commit.slice(0,7)}</code></span></div>`;
      }

      return `
        <div class="card">
          <h2>${dots} ${result.name}</h2>
          <div class="badge ${badgeClass}">${badgeText} — ${result.ms}ms</div>
          <div class="checks">${checks}</div>
          ${result.error ? `<div class="error-box" style="margin-top:0.5rem">${result.error}</div>` : ''}
          <p class="detail"><strong>Endpoint:</strong> <code>${result.url}</code></p>
        </div>
      `;
    }

    async function refresh() {
      const grid = document.getElementById('status-grid');
      grid.innerHTML = '<div class="card"><h2 class="refreshing">Checking health…</h2></div>'.repeat(3);

      const results = await Promise.all([
        fetchHealth(ENDPOINTS.production),
        fetchHealth(ENDPOINTS.staging),
        fetchHealth(ENDPOINTS.local),
      ]);

      grid.innerHTML = results.map(renderCard).join('');
      document.getElementById('last-checked').textContent = 'Last checked: ' + new Date().toLocaleString();
    }

    let countdown = REFRESH_S;
    setInterval(() => {
      countdown--;
      if (countdown <= 0) { countdown = REFRESH_S; refresh(); }
      document.getElementById('countdown').textContent = countdown;
    }, 1000);

    refresh();
  </script>
</body>
</html>
