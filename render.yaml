services:
  - type: web
    name: rekrutai-prod
    env: node
    branch: main
    buildCommand: cd client && npm install --include=dev && npm run build && cd .. && npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REKRUT_AI_URL
        value: https://rekrutai.co
      - key: APP_URL
        value: https://rekrutai.co
      - key: FRONTEND_URL
        value: https://rekrutai.co
      - key: BASE_URL
        value: https://rekrutai.co
      - key: CORS_ORIGINS
        value: https://rekrutai.co,https://www.rekrutai.co
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
