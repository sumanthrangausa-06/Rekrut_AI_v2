# docs/release/module-versions.yaml
# Release truth for module trains. Canonical copy: staging branch.
# staging_version / prod_version / status / last_train are Relay-owned.
# dev_version is supplied by Lead in the train manifest and verified
# by Relay against the live dev tip before the manifest freezes.
# A version counts as "on staging" ONLY when status: current, i.e.
# the train deployed AND passed the per-module staging retest.
# Anything else (in-flight, failed, aborted) is not a promotion.
#
# Seeded 2026-10-19 by Relay (first commit) with Train 1 in flight.
# Seed values per module-trains design (2026-10-18) section 1/2.4:
# v1.0 where the module journey is proven, v0.x where it is not.

