name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
  push:
    branches:
      - dev
      - staging
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Build client
        run: npm run build --prefix client

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level high
        # This will fail the job if critical/high vulnerabilities are found

  e2e-tests:
    name: E2E Tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [candidate, recruiter, admin, payment, other]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rekrut_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Build client
        run: npm run build --prefix client

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U test; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done
          echo "PostgreSQL is ready"

      - name: Generate test secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 64)" >> $GITHUB_ENV
          echo "SESSION_SECRET=$(openssl rand -hex 64)" >> $GITHUB_ENV
          echo "ADMIN_PASSWORD=$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9' | head -c 16)!A1" >> $GITHUB_ENV

      - name: Run database migrations
        run: |
          npm run migrate 2>&1 | tee migration-debug.log
          MIGRATE_EXIT=${PIPESTATUS[0]}
          if [ $MIGRATE_EXIT -ne 0 ]; then
            echo "=== MIGRATION FAILED ==="
            cat migration-debug.log
            exit 1
          fi
        env:
          NODE_ENV: e2e
          DATABASE_URL: postgresql://test:test@localhost:5432/rekrut_test
          JWT_SECRET: ${{ env.JWT_SECRET }}
          SESSION_SECRET: ${{ env.SESSION_SECRET }}

      - name: Upload migration debug log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-debug-log-${{ matrix.group }}
          path: migration-debug.log
          retention-days: 1

      - name: Start application
        run: |
          npm start &
          SERVER_PID=$!
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:3000/health > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "❌ Server failed to start"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        env:
          NODE_ENV: e2e
          PORT: 3000
          DATABASE_URL: postgresql://test:test@localhost:5432/rekrut_test
          JWT_SECRET: ${{ env.JWT_SECRET }}
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          ADMIN_USERNAME: admin

      - name: Run E2E tests (${{ matrix.group }})
        run: |
          case "${{ matrix.group }}" in
            candidate)
              npx playwright test \
                e2e/candidate-*.spec.ts \
                e2e/application-submission-flow.spec.ts \
                e2e/ai-coaching-flow.spec.ts \
                e2e/job-search-filtering.spec.ts
              ;;
            recruiter)
              npx playwright test e2e/recruiter-*.spec.ts
              ;;
            admin)
              npx playwright test e2e/admin-*.spec.ts
              ;;
            payment)
              npx playwright test e2e/payment-*.spec.ts
              ;;
            other)
              npx playwright test \
                e2e/auth-persistence.spec.ts \
                e2e/dark-mode.spec.ts \
                e2e/debug-*.spec.ts \
                e2e/mobile-navigation.spec.ts \
                e2e/navigation-*.spec.ts \
                e2e/password-reset-flow.spec.ts \
                e2e/public-pages.spec.ts \
                e2e/settings-flow.spec.ts
              ;;
          esac
        env:
          CI: true
          NODE_ENV: e2e
          PORT: 3000
          BASE_URL: http://localhost:3000
          DATABASE_URL: postgresql://test:test@localhost:5432/rekrut_test
          JWT_SECRET: ${{ env.JWT_SECRET }}
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
          ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          ADMIN_USERNAME: admin

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.group }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7

  health-check:
    name: Health Check (Dev)
    runs-on: ubuntu-latest
    needs: [build, audit]
    steps:
      - name: Check dev API health
        run: |
          echo "Checking dev environment health..."
          for i in {1..5}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://rekrutai-dev.onrender.com/health || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ Dev API is healthy (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i/5: Got HTTP $response, retrying in 5s..."
            sleep 5
          done
          echo "❌ Dev API health check failed after 5 attempts"
          exit 1
