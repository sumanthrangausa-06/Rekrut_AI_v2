name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
  push:
    branches:
      - dev
      - staging
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Build client
        run: npm run build --prefix client

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level high
        # This will fail the job if critical/high vulnerabilities are found

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rekrut_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U test; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done
          echo "PostgreSQL is ready"

      - name: Run database migrations
        run: npm run migrate
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/rekrut_test
          JWT_SECRET: test-jwt-secret
          SESSION_SECRET: test-session-secret

      - name: Start application
        run: |
          npm start &
          SERVER_PID=$!
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:3000/health > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "❌ Server failed to start"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgresql://test:test@localhost:5432/rekrut_test
          JWT_SECRET: test-jwt-secret
          SESSION_SECRET: test-session-secret

      - name: Run E2E tests (sequential per-file to avoid SIGKILL)
        run: |
          chmod +x ./e2e/run-e2e-suite.sh
          ./e2e/run-e2e-suite.sh
        env:
          CI: true
          NODE_ENV: test
          PORT: 3000
          BASE_URL: http://localhost:3000
          DATABASE_URL: postgresql://test:test@localhost:5432/rekrut_test
          JWT_SECRET: test-jwt-secret
          SESSION_SECRET: test-session-secret

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  health-check:
    name: Health Check (Dev)
    runs-on: ubuntu-latest
    needs: [build, audit]
    steps:
      - name: Check dev API health
        run: |
          echo "Checking dev environment health..."
          for i in {1..5}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://rekrutai-dev.onrender.com/health || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ Dev API is healthy (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i/5: Got HTTP $response, retrying in 5s..."
            sleep 5
          done
          echo "❌ Dev API health check failed after 5 attempts"
          exit 1
