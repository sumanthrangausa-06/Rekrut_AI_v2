name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-to-prod" to confirm manual deployment'
        required: true
        type: string

env:
  RENDER_SERVICE_ID: srv-d69opaer433s73d6p570

jobs:
  verify:
    name: Verify Deployment Readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check branch (for push events)
        if: github.event_name == 'push'
        run: |
          echo "✅ Auto-deploy triggered by push to main"
          echo "Commit: ${{ github.sha }}"

      - name: Confirm deployment intent (for manual triggers)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy-to-prod" ]; then
            echo "❌ Deployment not confirmed. You must type 'deploy-to-prod' to proceed."
            exit 1
          fi
          echo "✅ Manual deployment confirmed by user."

      - name: Check branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "❌ Production deployments must be triggered from the main branch."
            echo "Current branch: ${{ github.ref }}"
            exit 1
          fi
          echo "✅ Deploying from main branch."

  ci-gate:
    name: Re-run CI Checks
    needs: verify
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Production via Render API
    needs: ci-gate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rekrutai.co
    steps:
      - name: Trigger Render Deploy
        run: |
          echo "🚀 Triggering production deployment on Render via API..."
          echo "Service ID: $RENDER_SERVICE_ID"
          echo "Commit: ${{ github.sha }}"

          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\": \"${{ github.sha }}\", \"clearCache\": \"do_not_clear\"}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response code: $http_code"
          echo "Response body: $body"

          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
            echo "❌ Failed to trigger Render deploy. HTTP $http_code"
            exit 1
          fi

          deploy_id=$(echo "$body" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          echo "✅ Render deploy triggered successfully"
          echo "Deploy ID: $deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_ENV"

      - name: Wait for deployment to complete
        run: |
          echo "⏳ Waiting for Render deployment to complete..."
          deploy_id="${{ env.deploy_id }}"
          service_id="$RENDER_SERVICE_ID"

          for i in {1..30}; do
            status=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/$service_id/deploys/$deploy_id" | \
              python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))")

            echo "Attempt $i/30: Deploy status = $status"

            if [ "$status" = "live" ]; then
              echo "✅ Deployment is live!"
              exit 0
            elif [ "$status" = "update_failed" ] || [ "$status" = "build_failed" ]; then
              echo "❌ Deployment failed with status: $status"
              exit 1
            fi

            sleep 20
          done

          echo "❌ Deployment did not complete within the expected time"
          exit 1

      - name: Post-deploy health check
        run: |
          echo "🏥 Running post-deploy health check..."
          for i in {1..10}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://rekrutai.co/health || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ Production is healthy (HTTP 200)"
              health=$(curl -s https://rekrutai.co/health)
              echo "Health response: $health"
              exit 0
            fi
            echo "Attempt $i/10: Got HTTP $response, retrying in 15s..."
            sleep 15
          done
          echo "❌ Production health check failed after 10 attempts"
          exit 1

      - name: Notify deployment complete
        if: success()
        run: |
          echo "✅ Production deployment completed successfully!"
          echo "Commit: ${{ github.sha }}"
          echo "Deployed by: ${{ github.actor }}"
          echo "URL: https://rekrutai.co"
